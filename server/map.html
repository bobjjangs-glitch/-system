<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <link rel="stylesheet" href="/leaflet/leaflet.css" />
    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
        background: #eef2f4;
        font-family: system-ui;
      }
      .number {
        background: #142d35;
        color: white;
        border: 3px solid white;
        border-radius: 50%;
        text-align: center;
        line-height: 27px;
        font-weight: 800;
        box-shadow: 0 2px 8px #0003;
      }
      .driver {
        background: #b9ec70;
        color: #173628;
      }
      .company {
        background: #faad65;
        color: #173628;
      }
      .leaflet-control-attribution {
        font-size: 9px;
      }
      .leaflet-popup-content {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script src="/leaflet/leaflet.js"></script>
    <script>
      const map = L.map("map", { zoomControl: false }).setView(
        [36.3504, 127.3848],
        12,
      );
      L.control.zoom({ position: "bottomright" }).addTo(map);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);
      let layer = L.layerGroup().addTo(map),
        first = true,
        lastKey = "";
      const colors = [
        "#165b52",
        "#5b6bbb",
        "#d38b38",
        "#ab65a0",
        "#348bb8",
        "#8b8d3b",
      ];
      function popup(text) {
        const el = document.createElement("div");
        el.textContent = text;
        return el;
      }
      function marker(p, label, text, cls = "") {
        if (!Number.isFinite(p.lat) || !Number.isFinite(p.lng)) return;
        L.marker([p.lat, p.lng], {
          icon: L.divIcon({
            className: "number " + cls,
            html: String(label).replace(/[<>&]/g, ""),
            iconSize: [30, 30],
            iconAnchor: [15, 15],
          }),
        })
          .bindPopup(popup(text))
          .addTo(layer);
      }
      window.updateDispatchMap = function (data) {
        layer.clearLayers();
        const points = [];
        if (data.company) {
          marker(
            data.company,
            "⌂",
            data.company.name + " · 출발 / 복귀",
            "company",
          );
          points.push([data.company.lat, data.company.lng]);
        }
        for (const [rIndex, route] of (data.routes || []).entries()) {
          if (route.geometry?.length)
            L.polyline(
              route.geometry.map((p) => [p.lat, p.lng]),
              {
                color: colors[rIndex % colors.length],
                weight: 3,
                opacity: 0.7,
                dashArray:
                  route.estimateSource === "approximate" ? "6 8" : undefined,
              },
            ).addTo(layer);
          for (const stop of route.stops || []) {
            if (stop.lat == null || stop.lng == null) continue;
            marker(
              stop,
              String(stop.sequence),
              route.driverName + " · " + stop.recipient + " · " + stop.address,
            );
            points.push([stop.lat, stop.lng]);
          }
        }
        for (const driver of data.drivers || []) {
          const p = driver.position;
          if (p) {
            const age = Date.now() - Date.parse(p.recordedAt);
            marker(
              p,
              driver.name.slice(-2),
              driver.name +
                (age < 120000 ? " · 위치 수신 중" : " · 마지막 수신 위치"),
              "driver",
            );
            points.push([p.lat, p.lng]);
          }
        }
        const key = (data.routes || []).map((r) => r.id).join(",");
        if (points.length && (first || key !== lastKey)) {
          map.fitBounds(L.latLngBounds(points).pad(0.16), { maxZoom: 14 });
          first = false;
          lastKey = key;
        }
        setTimeout(() => map.invalidateSize(), 60);
      };
      window.addEventListener("message", (e) => {
        try {
          const data = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
          if (data?.type === "dispatch-map")
            window.updateDispatchMap(data.payload);
        } catch {}
      });
      if (window.ReactNativeWebView)
        window.ReactNativeWebView.postMessage("ready");
      else window.parent.postMessage("dispatch-map-ready", "*");
    </script>
  </body>
</html>
